[project]
name = "gpx-converter"
version = "0.1.0"
description = "PDF 기타 타브 악보 -> Guitar Pro 변환 MCP 서버"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=0.2.0,<2",
    "mido>=1.2.10",
    "pyguitarpro>=0.7.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# mcp/ 에 __init__.py 를 두면 파이썬 `mcp` 라이브러리를 가린다.
# 설치형 패키지가 아니라 로컬 MCP 서버이므로 빌드하지 않는다.
# 서버는 `uv run mcp/run_mcp_server.py` 로 실행한다 (`-m` 은 패키지를 요구해서 못 쓴다).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=mcp"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
